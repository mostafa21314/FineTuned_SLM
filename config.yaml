# =========================
# Project Configuration
# =========================

project:
  name: "egx30-banks-qa-llm"
  description: "End-to-end pipeline for Q&A about financial disclosures and reports of EGX30-listed banks (CIB, Credit Agricole Egypt, ADIB Egypt)"
  version: "0.1.0"

# =========================
# Domain & Use Case
# =========================

domain:
  topic_prompt: >
    You are an expert financial analyst assistant specializing in banking sector disclosures
    and financial reports of Egyptian publicly listed banks.
    Answer questions about EGX-listed banks' financial filings and disclosures, including
    annual reports, quarterly financial statements, earnings releases, balance sheets,
    income statements, cash flow statements, risk management disclosures, capital adequacy,
    liquidity ratios, asset quality, management discussion and analysis (MD&A),
    corporate governance, and regulatory compliance with the Central Bank of Egypt (CBE).
  use_case: "question_answering"
  language: "en"

# =========================
# Data Sources
# =========================

data_sources:
  web:
    enabled: true
    # Web scraping for EGX disclosures, investor relations pages, and regulatory filings
    seed_urls:
      - "https://www.egx.com.eg"
      - "https://www.cibeg.com"
      - "https://www.ca-egypt.com"
      - "https://www.adib.eg"

    max_pages: 1000
    crawl_depth: 3

  pdf:
    enabled: true
    directories:
      - "data/raw/pdfs"
    allowed_extensions:
      - ".pdf"
      - ".txt"
      - ".htm"
      - ".html"

  egx:
    enabled: true
    filing_types:
      - "Annual Report"
      - "Quarterly Financial Statements"
      - "Earnings Release"
      - "Board of Directors Report"
      - "Corporate Governance Report"
    # Target specific EGX30-listed banks
    tickers:
      - "CIB"    # Commercial International Bank Egypt
      - "CAE"    # Credit Agricole Egypt
      - "ADIB"   # Abu Dhabi Islamic Bank Egypt

# =========================
# Data Processing
# =========================

data_processing:
  cleaning:
    min_text_length: 200
    remove_duplicates: true
    language_filter: "en"

  chunking:
    max_tokens: 512
    overlap_tokens: 64

  storage:
    format: "jsonl"
    path: "data/processed"

# =========================
# Dataset Generation
# =========================

dataset:
  qa_generation:
    questions_per_chunk: 3
    max_answer_tokens: 256

  augmentation:
    enabled: true
    llm_provider: "openai"   # or "anthropic", "local"
    temperature: 0.7

  splits:
    train: 0.8
    validation: 0.1
    test: 0.1

# =========================
# Model & Fine-tuning
# =========================

model:
  base_model: "meta-llama/Meta-Llama-3-7B"
  max_sequence_length: 2048

fine_tuning:
  method: "qlora"           # lora | qlora
  output_dir: "models/fine_tuned"
  num_epochs: 3
  batch_size: 2
  learning_rate: 2e-4
  gradient_accumulation_steps: 8
  fp16: true

# =========================
# Evaluation & Benchmarking
# =========================

evaluation:
  metrics:
    - "bleu"
    - "rouge"
  benchmark:
    questions: 100
    auto_generate: true

# =========================
# Deployment
# =========================

deployment:
  api:
    host: "0.0.0.0"
    port: 8000
    auth_enabled: true

  inference:
    max_new_tokens: 256
    temperature: 0.2

# =========================
# Orchestration
# =========================

orchestration:
  scheduler:
    enabled: true
    retrain_cron: "0 2 * * 0"  # weekly retraining

# =========================
# Logging & Monitoring
# =========================

logging:
  level: "INFO"
  log_dir: "logs"
